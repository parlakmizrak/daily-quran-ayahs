name: Daily Quran Ayahs

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quran-ayahs
  cancel-in-progress: false

jobs:
  post-ayahs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post daily ayahs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          TOTAL_AYAHS = 6236
          DAILY_COUNT = 7
          AYAH_COUNTS = (
              7, 286, 200, 176, 120, 165, 206, 75, 129, 109, 123, 111,
              43, 52, 99, 128, 111, 110, 98, 135, 112, 78, 118, 64,
              77, 227, 93, 88, 69, 60, 34, 30, 73, 54, 45, 83, 182,
              88, 75, 85, 54, 53, 89, 59, 37, 35, 38, 29, 18, 45,
              60, 49, 62, 55, 78, 96, 29, 22, 24, 13, 14, 11, 11,
              18, 12, 12, 30, 52, 52, 44, 28, 28, 20, 56, 40, 31,
              50, 40, 46, 42, 29, 19, 36, 25, 22, 17, 19, 26, 30,
              20, 15, 21, 11, 8, 8, 19, 5, 8, 8, 11, 11, 8, 3,
              9, 5, 4, 7, 3, 6, 3, 5, 4, 5, 6,
          )
          CHAPTER_CACHE = {}

          def fetch_json(url):
              request = Request(url, headers={"User-Agent": "DailyQuranAyahs/1.0"})
              with urlopen(request, timeout=25) as response:
                  return json.loads(response.read())

          def global_to_reference(number):
              remaining = number
              for surah_number, count in enumerate(AYAH_COUNTS, start=1):
                  if remaining <= count:
                      return surah_number, remaining
                  remaining -= count
              raise ValueError(f"Invalid global ayah number: {number}")

          def get_chapter(number):
              if number not in CHAPTER_CACHE:
                  url = f"https://api.quran.com/api/v4/chapters/{number}?language=en"
                  CHAPTER_CACHE[number] = fetch_json(url)["chapter"]
              return CHAPTER_CACHE[number]

          def clean_translation(text):
              text = re.sub(r"<sup[^>]*>.*?</sup>", "", text, flags=re.S)
              text = re.sub(r"<[^>]+>", "", text)
              return " ".join(html.unescape(text).split())

          def get_ayah(number):
              surah_number, ayah_number = global_to_reference(number)
              verse_key = f"{surah_number}:{ayah_number}"
              url = (
                  f"https://api.quran.com/api/v4/verses/by_key/{verse_key}"
                  "?translations=20&fields=text_uthmani"
              )
              verse = fetch_json(url)["verse"]
              translations = [
                  item for item in verse.get("translations", [])
                  if item.get("resource_id") == 20
              ]
              if not translations:
                  raise ValueError(f"Sahih International missing for {verse_key}")
              chapter = get_chapter(surah_number)
              arabic = {
                  "text": verse["text_uthmani"],
                  "numberInSurah": ayah_number,
                  "surah": {
                      "number": surah_number,
                      "englishName": chapter["name_simple"],
                      "englishNameTranslation": chapter["translated_name"]["name"],
                  },
              }
              english = {"text": clean_translation(translations[0]["text"])}
              return arabic, english

          def send_message(token, channel, text):
              data = urlencode({"chat_id": channel, "text": text}).encode()
              request = Request(
                  f"https://api.telegram.org/bot{token}/sendMessage", data=data
              )
              with urlopen(request, timeout=25) as response:
                  result = json.loads(response.read())
              if not result.get("ok"):
                  raise ValueError(f"Telegram rejected the message: {result}")

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          channel = os.environ.get("CHANNEL_ID", "")
          if not token or not channel:
              raise SystemExit("Telegram secrets are missing")

          state_path = Path("state.json")
          if state_path.exists():
              state = json.loads(state_path.read_text())
          else:
              state = {"next_ayah": 1}
          next_ayah = int(state.get("next_ayah", 1))

          if next_ayah > TOTAL_AYAHS:
              print("All 6236 ayahs have already been posted")
              raise SystemExit(0)

          posted = 0
          for _ in range(DAILY_COUNT):
              if next_ayah > TOTAL_AYAHS:
                  break
              try:
                  arabic, english = get_ayah(next_ayah)
                  surah = arabic["surah"]
                  reference = f"{surah['number']}:{arabic['numberInSurah']}"
                  heading = (
                      f"{surah['englishName']} "
                      f"({surah['englishNameTranslation']}) — {reference}"
                  )
                  message = (
                      f"{heading}\n\n"
                      f"Arabic (Uthmani script):\n{arabic['text']}\n\n"
                      f"English — Sahih International:\n{english['text']}\n\n"
                      "Text source: Quran.com"
                  )
                  send_message(token, channel, message)
              except Exception as error:
                  print(f"Stopped at global ayah {next_ayah}: {error}")
                  break
              next_ayah += 1
              posted += 1
              time.sleep(1)

          state = {"next_ayah": next_ayah}
          state_path.write_text(json.dumps(state, indent=2) + "\n")
          print(f"Posted {posted} ayahs; next global ayah is {next_ayah}")
          PY
      - name: Save reading position
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Quran reading position"
            git pull --rebase origin main
            git push
          fi
